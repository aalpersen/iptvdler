name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Requests for bundled channels/playlists or for downloading DRM-protected streams can't be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: platform
    attributes:
      label: Platforms
      multiple: true
      options: [Android, Desktop (all), Windows, macOS, Linux]
